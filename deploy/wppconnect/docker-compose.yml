# Servidor do WhatsApp do Deliveryzim (WPPConnect), para varias lojas conectadas ao mesmo tempo.
# Copia identica do que roda na VPS em /opt/wppconnect-deliveryzim/docker-compose.yml.
# Instalacao, atualizacao e diagnostico: deploy/wppconnect/README.md.
#
# O .env (so SECRET_KEY e WEBHOOK_URL) fica na VPS, com permissao 600, e NUNCA vai para o Git.
name: wppconnect-deliveryzim
services:
  wppconnect:
    image: deliveryzim/wppconnect-server:2.10.73-wa-js-4.8.2
    container_name: wppconnect-deliveryzim
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:21467:21465"   # so a propria VPS acessa; nunca abrir para a internet
    init: true                    # recolhe processos do navegador que terminam (evita acumulo)
    shm_size: "2gb"               # memoria compartilhada dos navegadores (uma sessao = um Chromium)
    mem_limit: 6g                 # ~500 MB por loja conectada + picos ao baixar conversas: 8 a 10 lojas
    memswap_limit: 6g             # nao usa a swap da VPS (deixava tudo lento)
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - tokens:/usr/src/wpp-server/tokens
      - userdata:/usr/src/wpp-server/userDataDir
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:21465/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  tokens:
  userdata:
