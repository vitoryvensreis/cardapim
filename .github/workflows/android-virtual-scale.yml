name: Deliveryzim Balança e Impressora Virtual Android APK

on:
  push:
    branches: [main]
    paths:
      - 'virtual-scale/**'
      - '.github/workflows/android-virtual-scale.yml'
  pull_request:
    branches: [main]
    paths:
      - 'virtual-scale/**'
      - '.github/workflows/android-virtual-scale.yml'
  workflow_dispatch:

permissions:
  contents: write  # publica o APK de teste como pre-release (nunca "latest": o link do Agent usa a latest)

jobs:
  android:
    name: Testar protocolos e compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes dos bytes de protocolo
        run: |
          set -euo pipefail
          mkdir -p /tmp/scale-test
          javac -d /tmp/scale-test virtual-scale/android/app/src/main/java/br/com/deliveryzim/virtualscale/ScaleProtocol.java virtual-scale/android/tests/ScaleProtocolTest.java
          java -cp /tmp/scale-test br.com.deliveryzim.virtualscale.ScaleProtocolTest
          javac -encoding UTF-8 -d /tmp/scale-test virtual-scale/android/app/src/main/java/br/com/deliveryzim/virtualscale/EscPos.java virtual-scale/android/tests/EscPosTest.java
          java -cp /tmp/scale-test br.com.deliveryzim.virtualscale.EscPosTest
      - name: Instalar SDK Android
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK de teste
        working-directory: virtual-scale/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Deliveryzim-Balanca-Virtual-Android-debug
          path: virtual-scale/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK de teste (pre-release, main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versao="$(sed -n "s/.*versionName '\([0-9.]*\)'.*/\1/p" virtual-scale/android/app/build.gradle)"
          tag="android-teste-v$versao"
          cp virtual-scale/android/app/build/outputs/apk/debug/app-debug.apk Deliveryzim-Testes-Android.apk
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Deliveryzim-Testes-Android.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" Deliveryzim-Testes-Android.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Deliveryzim Testes Android $versao (balança e impressora virtual)" \
              --notes "Somente para teste. Instale o APK no celular: aparecem dois apps, Balança Virtual e Impressora Virtual."
          fi
