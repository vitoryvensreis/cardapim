name: Android SMS Gateway APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/sms-gateway/**"
      - ".github/workflows/sms-gateway-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar APK debug
        working-directory: android/sms-gateway
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: deliveryzim-sms-gateway-debug
          path: android/sms-gateway/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
