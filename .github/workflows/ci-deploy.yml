name: Cardapim - CI e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardapim-production
  cancel-in-progress: false

jobs:
  quality:
    name: Validar PHP e rotas
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cardapim_ci_root_only
          MYSQL_DATABASE: cardapim_ci
          MYSQL_USER: cardapim_ci
          MYSQL_PASSWORD: cardapim_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cardapim_ci
      DB_USERNAME: cardapim_ci
      DB_PASSWORD: cardapim_ci_only
      CARDAPIM_TEST_WHATSAPP: '85900000000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql
          coverage: none

      - name: Sintaxe PHP
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database dev public routes -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Validar Composer
        run: composer validate --no-check-publish

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in public/assets/js/*.js; do node --check "$file"; done

      - name: Testes unitarios sem banco
        run: php tests/unit/documento.php

      - name: Interface sem emojis e sem estilos inline
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' app/Views; then
            echo "::error::Emojis nao sao permitidos nas interfaces."; exit 1
          fi
          if grep -rnE 'style="|onclick=' app/Views public/index.php; then
            echo "::error::Use CSS e JS externos."; exit 1
          fi

      - name: Aplicar e testar schema MySQL
        shell: bash
        run: |
          set -euo pipefail
          php database/migrate.php --status | tee /tmp/cardapim-migrations-before.txt
          grep -q 'PENDENTE .*create_planos.php' /tmp/cardapim-migrations-before.txt
          grep -q 'PENDENTE .*create_restaurantes.php' /tmp/cardapim-migrations-before.txt
          php database/migrate.php --apply
          php database/migrate.php --status | tee /tmp/cardapim-migrations-after.txt
          grep -q 'Nenhuma migration pendente' /tmp/cardapim-migrations-after.txt
          php database/seed-demo-planos.php --apply
          php database/seed-demo-planos.php --apply
          php database/seed-demo-planos.php --verify
          php database/verify-visibilidade-log-user.php --verify
          php database/seed-configuracoes-restaurante.php --apply
          php database/seed-configuracoes-restaurante.php --apply
          php database/seed-configuracoes-restaurante.php --verify
          php tests/integration/configuracoes.php
          php tests/integration/schema.php
          php tests/integration/planos-publicos.php
          php database/verify-user-schema.php --verify
          php tests/integration/user.php
          php database/seed-test-users.php --apply
          php database/seed-test-users.php --apply
          php database/seed-test-users.php --verify
          php -r '$d=new PDO("mysql:host=127.0.0.1;port=3306;dbname=cardapim_ci;charset=utf8mb4", "cardapim_ci", "cardapim_ci_only"); $n=$d->query("SELECT COUNT(*) FROM planos WHERE nome LIKE \"Demonstração %\"")->fetchColumn(); exit((int)$n===3 ? 0 : 1);'

      - name: Smoke test HTTP local
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:18080 -t public dev/router.php >/tmp/cardapim-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          for path in / /login /cadastro /assets/css/core.css /assets/css/site.css /assets/css/pages.css /assets/js/core.js /assets/js/site.js /assets/js/forms.js /assets/icons/lucide.svg /assets/img/icone.svg; do
            curl --fail --silent --show-error "http://127.0.0.1:18080$path" >/dev/null
          done
          code="$(curl --silent --show-error -o /tmp/cardapim-status.json -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:18080/status)"
          test "$code" = "200"
          php -r '$d=json_decode(file_get_contents("/tmp/cardapim-status.json"), true, 512, JSON_THROW_ON_ERROR); exit(($d["servicos"]["php"]["situacao"] === "operacional" && $d["servicos"]["mysql"]["situacao"] === "conectado") ? 0 : 1);'
          curl --fail --silent --show-error http://127.0.0.1:18080/status | grep -q 'Banco de dados'
          page="$(curl --fail --silent --show-error http://127.0.0.1:18080/)"
          [[ "$page" == *'/assets/img/logo-colorida.svg'* ]]
          [[ "$page" == *'Seu restaurante cresce'* ]]
          [[ "$page" == *'id="planos"'* ]]
          [[ "$page" == *'Demonstração Mensal'* ]]
          [[ "$page" == *'Demonstração Semestral'* ]]
          [[ "$page" == *'Demonstração Anual'* ]]
          printf '%s' "$page" | grep -Eq 'href="/cadastro\?plano_id=[1-9][0-9]*"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/rota-inexistente)" = "404"
          # Validar views reais, sem post nem autenticacao funcional nesta fase.
          login="$(curl --fail --silent --show-error http://127.0.0.1:18080/login)"
          [[ "$login" == *'Entre na sua conta.'* ]]
          [[ "$login" == *'Login em preparação'* ]]
          [[ "$login" == *'autocomplete="current-password"'* ]]
          [[ "$login" == *'disabled'* ]]
          [[ "$login" == *'/assets/css/pages.css'* ]]
          plan_id="$(php -r 'require "bootstrap/app.php"; $p=\Cardapim\Core\Database::connect()->query("SELECT id FROM planos WHERE ativo=1 AND visibilidade=1 ORDER BY id LIMIT 1")->fetchColumn(); echo (int)$p;')"
          test "$plan_id" -gt 0
          register="$(curl --fail --silent --show-error "http://127.0.0.1:18080/cadastro?plano_id=$plan_id")"
          [[ "$register" == *'Crie sua conta.'* ]]
          [[ "$register" == *'Plano selecionado'* ]]
          [[ "$register" == *"name=\"plano_id\" value=\"$plan_id\""* ]]
          [[ "$register" == *'name="nome_restaurante"'* ]]
          [[ "$register" == *'name="usuario"'* ]]
          [[ "$register" == *'type="checkbox"'* ]]
          [[ "$register" == *'Cadastro em preparação'* ]]
          [[ "$register" == *'name="cpf"'* ]]
          [[ "$register" == *'data-mask="cpf"'* ]]
          [[ "$register" == *'data-mask="phone"'* ]]
          [[ "$register" == *'/assets/js/forms.js'* ]]
          [[ "$page" == *'/assets/icons/lucide.svg#chef-hat'* ]]
          [[ "$page" == *'class="site-footer"'* ]]
          invalid="$(curl --fail --silent --show-error 'http://127.0.0.1:18080/cadastro?plano_id=nao-existe')"
          [[ "$invalid" == *'Plano não encontrado'* ]]
          escaped="$(curl --fail --silent --show-error -G --data-urlencode 'plano_id=<script>alert(1)</script>' http://127.0.0.1:18080/cadastro)"
          [[ "$escaped" != *'<script>alert(1)</script>'* ]]
          for path in /privacidade /termos-de-uso /cookies /exclusao-de-dados /tratamento-de-dados; do
            html="$(curl --fail --silent --show-error "http://127.0.0.1:18080$path")"
            [[ "$html" == *'CENTRAL DE INFORMAÇÕES LEGAIS'* ]]
            [[ "$html" == *'Documento em revisão'* ]]
            [[ "$html" == *'/assets/css/pages.css'* ]]
          done
          [[ "$page" == *'href="/privacidade"'* ]]
          [[ "$page" == *'href="/termos-de-uso"'* ]]
          [[ "$page" == *'href="/cookies"'* ]]
          [[ "$page" == *'href="/exclusao-de-dados"'* ]]
          [[ "$page" == *'href="/tratamento-de-dados"'* ]]
          code404="$(curl --silent --show-error -o /tmp/cardapim-404.html -w '%{http_code}' http://127.0.0.1:18080/rota-inexistente)"
          test "$code404" = "404"
          grep -q 'Esse caminho não existe' /tmp/cardapim-404.html
          grep -q 'PÁGINA NÃO ENCONTRADA' /tmp/cardapim-404.html
          grep -q '/assets/css/pages.css' /tmp/cardapim-404.html
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/login)" = "405"
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/cadastro)" = "405"

  deploy:
    name: Publicar na VPS somente quando habilitado
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && vars.CARDAPIM_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enviar release por SSH e ativar
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CARDAPIM_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.CARDAPIM_VPS_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.CARDAPIM_VPS_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CARDAPIM_VPS_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.CARDAPIM_DEPLOY_ROOT }}
          DEPLOY_URL: ${{ vars.CARDAPIM_DEPLOY_URL }}
          DEPLOY_SSH_PORT: ${{ vars.CARDAPIM_VPS_SSH_PORT || '22' }}
          RUN_MIGRATIONS: ${{ vars.CARDAPIM_RUN_MIGRATIONS || 'false' }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_SSH_KEY" "$DEPLOY_KNOWN_HOSTS" "$DEPLOY_ROOT" "$DEPLOY_URL"; do
            if [[ -z "$value" ]]; then
              echo "::error::Configure os secrets e vars CARDAPIM no GitHub antes do deploy."
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::Host invalido"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Usuario invalido"; exit 1; }
          [[ "$DEPLOY_ROOT" =~ ^/home/[A-Za-z0-9._-]+/apps/cardapim$ ]] || { echo "::error::Diretorio deve estar no home do usuario"; exit 1; }
          [[ "$DEPLOY_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || { echo "::error::URL HTTPS invalida"; exit 1; }
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]+$ ]] || { echo "::error::Porta SSH invalida"; exit 1; }
          [[ "$RUN_MIGRATIONS" == "false" || "$RUN_MIGRATIONS" == "true" ]] || exit 1
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/cardapim_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cardapim_deploy" "$HOME/.ssh/known_hosts"
          host="$DEPLOY_USER@$DEPLOY_HOST"
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_args=(-i "$HOME/.ssh/cardapim_deploy" -p "$DEPLOY_SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${ssh_args[@]}" "$host" "mkdir -p '$DEPLOY_ROOT/releases/$release'"
          rsync -az --delete --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='storage/' --exclude='vendor/' \
            -e "ssh -i $HOME/.ssh/cardapim_deploy -p $DEPLOY_SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./ "$host:$DEPLOY_ROOT/releases/$release/"
          ssh "${ssh_args[@]}" "$host" bash -se -- "$DEPLOY_ROOT" "$release" "$DEPLOY_URL" "$RUN_MIGRATIONS" < deploy/scripts/activate-release.sh
