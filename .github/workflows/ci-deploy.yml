name: Cardapim - CI e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardapim-production
  cancel-in-progress: false

jobs:
  quality:
    name: Validar PHP e rotas
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cardapim_ci_root_only
          MYSQL_DATABASE: cardapim_ci
          MYSQL_USER: cardapim_ci
          MYSQL_PASSWORD: cardapim_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cardapim_ci
      DB_USERNAME: cardapim_ci
      DB_PASSWORD: cardapim_ci_only
      CARDAPIM_TEST_WHATSAPP: '85900000000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql, pdo_sqlite, pcntl, gd, dom
          coverage: none

      - name: Sintaxe PHP
        shell: bash
        run: |
          set -euo pipefail
          find app bin bootstrap config database dev public routes tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Validar Composer
        run: composer validate --no-check-publish

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in public/assets/js/*.js; do node --check "$file"; done

      - name: Testes unitarios sem banco
        shell: bash
        run: |
          set -euo pipefail
          php tests/unit/documento.php
          php tests/unit/catalogo.php
          php tests/unit/estoque.php
          php tests/unit/navegador.php
          php tests/unit/dominio.php
          php tests/unit/marca.php
          php tests/unit/assinaturas.php
          php tests/unit/gerencia.php
          php tests/unit/integracoes.php
          php tests/unit/tempo-real.php
          php tests/unit/cliente.php
          php tests/unit/entrega.php
          php tests/unit/caixa.php

      - name: Interface sem emojis e sem estilos inline
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' app/Views; then
            echo "::error::Emojis nao sao permitidos nas interfaces."; exit 1
          fi
          if grep -rnE 'style="|onclick=' app/Views public/index.php; then
            echo "::error::Use CSS e JS externos."; exit 1
          fi

      - name: Aplicar e testar schema MySQL
        shell: bash
        run: |
          set -euo pipefail
          php database/migrate.php --status | tee /tmp/cardapim-migrations-before.txt
          grep -q 'PENDENTE .*create_planos.php' /tmp/cardapim-migrations-before.txt
          grep -q 'PENDENTE .*create_restaurantes.php' /tmp/cardapim-migrations-before.txt
          php database/migrate.php --apply
          php database/migrate.php --status | tee /tmp/cardapim-migrations-after.txt
          grep -q 'Nenhuma migration pendente' /tmp/cardapim-migrations-after.txt
          php database/verify-gerencia-abas.php --verify
          php database/verify-integracoes.php --verify
          php database/verify-tempo-real.php --verify
          php database/verify-clientes.php --verify
          php database/verify-pedidos.php --verify
          php database/verify-caixa.php --verify
          php database/verify-entregas.php --verify
          php database/verify-avisos.php --verify
          php database/verify-garcom.php --verify
          php database/verify-cobranca.php --verify
          php database/verify-assinaturas.php --verify
          php database/seed-demo-planos.php --apply
          php database/seed-demo-planos.php --apply
          php database/seed-demo-planos.php --verify
          php database/verify-visibilidade-log-user.php --verify
          php database/seed-configuracoes-restaurante.php --apply
          php database/seed-configuracoes-restaurante.php --apply
          php database/seed-configuracoes-restaurante.php --verify
          php tests/integration/configuracoes.php
          php tests/integration/schema.php
          php tests/integration/planos-publicos.php
          php database/verify-user-schema.php --verify
          php tests/integration/user.php
          php database/verify-cnpj-restaurantes.php --verify
          php tests/integration/restaurantes.php
          php database/verify-cardapio-estoque.php --verify
          php tests/integration/cardapio-estoque.php
          php database/verify-endereco-restaurantes.php --verify
          php tests/integration/endereco-restaurantes.php
          php database/verify-sessoes-lembradas.php --verify
          php database/seed-test-users.php --apply
          php database/seed-test-users.php --apply
          php database/seed-test-users.php --verify
          php database/seed-restaurante-modelo.php --apply
          php database/seed-restaurante-modelo.php --apply
          php database/seed-restaurante-modelo.php --verify
          php database/seed-cardapio-exemplo.php --apply
          php database/seed-cardapio-exemplo.php --apply | tee /tmp/cardapim-cardapio-2.txt
          grep -q 'Criados agora: 0 categorias, 0 insumos, 0 produtos, 0 linhas' /tmp/cardapim-cardapio-2.txt
          php database/seed-cardapio-exemplo.php --verify
          php tests/integration/gerencia.php
          php -r '$d=new PDO("mysql:host=127.0.0.1;port=3306;dbname=cardapim_ci;charset=utf8mb4", "cardapim_ci", "cardapim_ci_only"); $n=$d->query("SELECT COUNT(*) FROM planos WHERE nome LIKE \"Demonstração %\"")->fetchColumn(); exit((int)$n===3 ? 0 : 1);'

      - name: Smoke test HTTP local
        shell: bash
        run: |
          set -euo pipefail
          # Servidor FALSO de iFood, Asaas e WPPConnect (somente testes; nada sai para a internet).
          php -S 127.0.0.1:18099 tests/fakes/integracoes-fake.php >/tmp/cardapim-fake.log 2>&1 &
          fake_pid=$!
          MAIL_DRIVER=log APP_URL=https://cardapim.test \
            ASAAS_URL_SANDBOX=http://127.0.0.1:18099/asaas/v3 ASAAS_URL_PRODUCAO=http://127.0.0.1:18099/asaas/v3 \
            WPPCONNECT_BASE_URL=http://127.0.0.1:18099/wpp WPPCONNECT_SECRET_KEY=segredo-ci \
            IFOOD_BASE_URL=http://127.0.0.1:18099/ifood IFOOD_CLIENT_ID=ifood-ci IFOOD_CLIENT_SECRET=ifood-segredo-ci \
            GEO_BRASILAPI_URL=http://127.0.0.1:18099/brasilapi GEO_VIACEP_URL=http://127.0.0.1:18099/viacep/ws GEO_NOMINATIM_URL=http://127.0.0.1:18099/nominatim \
            WS_ATIVO=1 WS_URL=ws://127.0.0.1:18095/ws REDIS_HOST=127.0.0.1 REDIS_PORT=6379 \
            php -S 127.0.0.1:18080 -t public dev/router.php >/tmp/cardapim-php.log 2>&1 &
          server_pid=$!
          # Servidor de tempo real (WebSocket) com Redis; mais abaixo roda de novo SEM Redis (modo reserva).
          APP_URL=https://cardapim.test WS_PORTA=18095 REDIS_HOST=127.0.0.1 REDIS_PORT=6379 php bin/tempo-real.php >/tmp/cardapim-ws.log 2>&1 &
          ws_pid=$!
          trap 'kill "$server_pid" "$fake_pid" "$ws_pid" 2>/dev/null || true; cat /tmp/cardapim-ws.log || true' EXIT
          sleep 2
          for path in / /login /cadastro /assets/css/core.css /assets/css/site.css /assets/css/pages.css /assets/js/core.js /assets/js/site.js /assets/js/forms.js /assets/icons/lucide.svg /assets/img/icone.svg; do
            curl --fail --silent --show-error "http://127.0.0.1:18080$path" >/dev/null
          done
          code="$(curl --silent --show-error -o /tmp/cardapim-status.json -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:18080/status)"
          test "$code" = "200"
          php -r '$d=json_decode(file_get_contents("/tmp/cardapim-status.json"), true, 512, JSON_THROW_ON_ERROR); exit(($d["servicos"]["php"]["situacao"] === "operacional" && $d["servicos"]["mysql"]["situacao"] === "conectado") ? 0 : 1);'
          curl --fail --silent --show-error http://127.0.0.1:18080/status | grep -q 'Banco de dados'
          page="$(curl --fail --silent --show-error http://127.0.0.1:18080/)"
          [[ "$page" == *'/assets/img/logo-colorida.svg'* ]]
          [[ "$page" == *'Seu restaurante cresce'* ]]
          [[ "$page" == *'id="planos"'* ]]
          [[ "$page" == *'Demonstração Mensal'* ]]
          [[ "$page" == *'Demonstração Semestral'* ]]
          [[ "$page" == *'Demonstração Anual'* ]]
          printf '%s' "$page" | grep -Eq 'href="/cadastro\?plano_id=[1-9][0-9]*"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/rota-inexistente)" = "404"
          # Views reais (o cadastro de verdade e testado em tests/http/planos-cadastro.sh).
          login="$(curl --fail --silent --show-error http://127.0.0.1:18080/login)"
          [[ "$login" == *'Entre na sua conta.'* ]]
          [[ "$login" == *'autocomplete="current-password"'* ]]
          [[ "$login" == *'name="_csrf"'* ]]
          [[ "$login" == *'action="/login"'* ]]
          [[ "$login" == *'/assets/css/pages.css'* ]]
          plan_id="$(php -r 'require "bootstrap/app.php"; $p=\Cardapim\Core\Database::connect()->query("SELECT id FROM planos WHERE ativo=1 AND visibilidade=1 ORDER BY id LIMIT 1")->fetchColumn(); echo (int)$p;')"
          test "$plan_id" -gt 0
          register="$(curl --fail --silent --show-error "http://127.0.0.1:18080/cadastro?plano_id=$plan_id")"
          [[ "$register" == *'Crie sua conta.'* ]]
          [[ "$register" == *"name=\"plano_id\" value=\"$plan_id\" checked"* ]]
          [[ "$register" == *'action="/cadastro"'* ]]
          [[ "$register" == *'name="_csrf"'* ]]
          [[ "$register" == *'name="nome_restaurante"'* ]]
          [[ "$register" == *'name="usuario"'* ]]
          [[ "$register" == *'type="checkbox"'* ]]
          [[ "$register" == *'Criar conta e continuar'* ]]
          [[ "$register" == *'name="cpf"'* ]]
          [[ "$register" == *'data-mask="cpf"'* ]]
          [[ "$register" == *'data-mask="phone"'* ]]
          [[ "$register" == *'/assets/js/forms.js'* ]]
          [[ "$page" == *'/assets/icons/lucide.svg?v='*'#chef-hat"'* ]]
          [[ "$page" == *'class="site-footer"'* ]]
          [[ "$page" == *'href="/catalogo"'* ]]
          [[ "$register" == *'data-unique="usuario"'* ]]
          [[ "$register" == *'data-unique="email"'* ]]
          [[ "$register" == *'data-unique="cnpj"'* ]]
          catalog="$(curl --fail --silent --show-error http://127.0.0.1:18080/catalogo)"
          [[ "$catalog" == *'Restaurante Modelo Cardapim'* ]]
          [[ "$catalog" == *'data-catalog-list'* ]]
          [[ "$catalog" == *'/assets/js/catalogo.js'* ]]
          [[ "$catalog" == *'href="/restaurante-modelo-cardapim"'* ]]
          restaurant="$(curl --fail --silent --show-error http://127.0.0.1:18080/restaurante-modelo-cardapim)"
          [[ "$restaurant" == *'id="cd-nome"'* ]]
          [[ "$restaurant" == *'/assets/js/cardapio.js'* ]]
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/slug-que-nao-existe)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/catalogo?cursor=lixo')" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/restaurantes)" = "301"
          curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/restaurantes > /tmp/cardapim-catalogo.json
          php -r '$d=json_decode(file_get_contents("/tmp/cardapim-catalogo.json"), true, 512, JSON_THROW_ON_ERROR); exit(is_array($d["itens"]) && in_array("restaurante-modelo-cardapim", array_column($d["itens"], "slug"), true) && !isset($d["itens"][0]["cnpj"]) ? 0 : 1);'
          curl --fail --silent --show-error 'http://127.0.0.1:18080/api/v1/cadastro/disponibilidade?campo=usuario&valor=teste_gerente' | grep -q '"disponivel":false'
          curl --fail --silent --show-error 'http://127.0.0.1:18080/api/v1/cadastro/disponibilidade?campo=email&valor=novo.cadastro%40example.test' | grep -q '"disponivel":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/api/v1/cadastro/disponibilidade?campo=senha&valor=x')" = "422"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/catalogo)" = "405"
          invalid="$(curl --fail --silent --show-error 'http://127.0.0.1:18080/cadastro?plano_id=nao-existe')"
          [[ "$invalid" == *'não está mais disponível'* ]]
          escaped="$(curl --fail --silent --show-error -G --data-urlencode 'plano_id=<script>alert(1)</script>' http://127.0.0.1:18080/cadastro)"
          [[ "$escaped" != *'<script>alert(1)</script>'* ]]
          for path in /privacidade /termos-de-uso /cookies /exclusao-de-dados /tratamento-de-dados; do
            html="$(curl --fail --silent --show-error "http://127.0.0.1:18080$path")"
            [[ "$html" == *'CENTRAL DE INFORMAÇÕES LEGAIS'* ]]
            [[ "$html" == *'Documento em revisão'* ]]
            [[ "$html" == *'/assets/css/pages.css'* ]]
          done
          [[ "$page" == *'href="/privacidade"'* ]]
          [[ "$page" == *'href="/termos-de-uso"'* ]]
          [[ "$page" == *'href="/cookies"'* ]]
          [[ "$page" == *'href="/exclusao-de-dados"'* ]]
          [[ "$page" == *'href="/tratamento-de-dados"'* ]]
          code404="$(curl --silent --show-error -o /tmp/cardapim-404.html -w '%{http_code}' http://127.0.0.1:18080/rota-inexistente)"
          test "$code404" = "404"
          grep -q 'Esse caminho não existe' /tmp/cardapim-404.html
          grep -q '/assets/css/pages.css' /tmp/cardapim-404.html
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/login)" = "419"
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/sair)" = "404"
          php tests/http/criar-contas-ci.php
          bash tests/http/auth.sh http://127.0.0.1:18080 restaurante-modelo-cardapim
          php tests/http/verificar-logs-ci.php
          bash tests/http/gerencia.sh http://127.0.0.1:18080 restaurante-modelo-cardapim
          php tests/http/verificar-gerencia-ci.php
          bash tests/http/integracoes.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          bash tests/http/plataforma.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          bash tests/http/cardapio.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          bash tests/http/pedidos.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          bash tests/http/caixa.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          bash tests/http/entregas.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          bash tests/http/pwa.sh http://127.0.0.1:18080 restaurante-modelo-cardapim
          bash tests/http/avisos.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          bash tests/http/garcom.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          bash tests/http/equipe-no-painel.sh http://127.0.0.1:18080 restaurante-modelo-cardapim
          bash tests/http/planos-cadastro.sh http://127.0.0.1:18080 restaurante-modelo-cardapim http://127.0.0.1:18099
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/js/planos.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/js/marca.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/js/integracoes.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/js/garcom.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/css/garcom.css >/dev/null
          bash tests/http/tempo-real.sh http://127.0.0.1:18080 restaurante-modelo-cardapim ws://127.0.0.1:18095/ws https://cardapim.test
          grep -q 'Redis conectado' /tmp/cardapim-ws.log
          kill -TERM "$ws_pid"; wait "$ws_pid" || true
          grep -q 'Tempo real encerrado' /tmp/cardapim-ws.log
          APP_URL=https://cardapim.test WS_PORTA=18095 REDIS_PORT= php bin/tempo-real.php >>/tmp/cardapim-ws.log 2>&1 &
          ws_pid=$!
          sleep 2
          bash tests/http/tempo-real.sh http://127.0.0.1:18080 restaurante-modelo-cardapim ws://127.0.0.1:18095/ws https://cardapim.test
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/js/tempo-real.js >/dev/null
          for path in /assets/js/estoque.js /assets/js/equipe.js /assets/js/perfil.js /assets/js/minha-conta.js /assets/js/confirmar.js /assets/vendor/qrcode-generator/qrcode.js /assets/vendor/leaflet/leaflet.js /assets/vendor/leaflet/leaflet.css; do
            curl --fail --silent --show-error "http://127.0.0.1:18080$path" >/dev/null
          done
          login_page="$(curl --fail --silent --show-error http://127.0.0.1:18080/login)"
          [[ "$login_page" == *'name="lembrar"'* ]]
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/cadastro)" = "405"

  deploy:
    name: Publicar na VPS somente quando habilitado
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && vars.CARDAPIM_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enviar release por SSH e ativar
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CARDAPIM_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.CARDAPIM_VPS_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.CARDAPIM_VPS_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CARDAPIM_VPS_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.CARDAPIM_DEPLOY_ROOT }}
          DEPLOY_URL: ${{ vars.CARDAPIM_DEPLOY_URL }}
          DEPLOY_SSH_PORT: ${{ vars.CARDAPIM_VPS_SSH_PORT || '22' }}
          RUN_MIGRATIONS: ${{ vars.CARDAPIM_RUN_MIGRATIONS || 'false' }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_SSH_KEY" "$DEPLOY_KNOWN_HOSTS" "$DEPLOY_ROOT" "$DEPLOY_URL"; do
            if [[ -z "$value" ]]; then
              echo "::error::Configure os secrets e vars CARDAPIM no GitHub antes do deploy."
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::Host invalido"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Usuario invalido"; exit 1; }
          [[ "$DEPLOY_ROOT" =~ ^/home/[A-Za-z0-9._-]+/apps/cardapim$ ]] || { echo "::error::Diretorio deve estar no home do usuario"; exit 1; }
          [[ "$DEPLOY_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || { echo "::error::URL HTTPS invalida"; exit 1; }
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]+$ ]] || { echo "::error::Porta SSH invalida"; exit 1; }
          [[ "$RUN_MIGRATIONS" == "false" || "$RUN_MIGRATIONS" == "true" ]] || exit 1
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/cardapim_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cardapim_deploy" "$HOME/.ssh/known_hosts"
          host="$DEPLOY_USER@$DEPLOY_HOST"
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_args=(-i "$HOME/.ssh/cardapim_deploy" -p "$DEPLOY_SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${ssh_args[@]}" "$host" "mkdir -p '$DEPLOY_ROOT/releases/$release'"
          rsync -az --delete --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='storage/' --exclude='/vendor/' \
            -e "ssh -i $HOME/.ssh/cardapim_deploy -p $DEPLOY_SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./ "$host:$DEPLOY_ROOT/releases/$release/"
          ssh "${ssh_args[@]}" "$host" bash -se -- "$DEPLOY_ROOT" "$release" "$DEPLOY_URL" "$RUN_MIGRATIONS" < deploy/scripts/activate-release.sh
