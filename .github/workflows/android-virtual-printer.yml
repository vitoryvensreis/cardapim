name: Deliveryzim Virtual Printer APK

on:
  push:
    branches:
      - feature/android-virtual-printer
    paths:
      - 'virtual-printer/**'
      - '.github/workflows/android-virtual-printer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'virtual-printer/**'
      - '.github/workflows/android-virtual-printer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Testes puros ESC/POS
        run: |
          mkdir -p /tmp/deliveryzim-test
          javac -d /tmp/deliveryzim-test virtual-printer/android/app/src/main/java/br/com/deliveryzim/virtualprinter/EscPosDecoder.java virtual-printer/android/tests/EscPosDecoderTest.java
          java -cp /tmp/deliveryzim-test br.com.deliveryzim.virtualprinter.EscPosDecoderTest
          python -m py_compile virtual-printer/tests/test_tcp.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar APK
        working-directory: virtual-printer/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: deliveryzim-virtual-printer-debug
          path: virtual-printer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
