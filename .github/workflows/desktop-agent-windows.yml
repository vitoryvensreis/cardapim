name: Deliveryzim Agent Windows EXE

on:
  push:
    branches: [main, feature/desktop-agent-windows]
    paths:
      - 'desktop-agent/**'
      - '.github/workflows/desktop-agent-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop-agent/**'
      - '.github/workflows/desktop-agent-windows.yml'
  workflow_dispatch:

permissions:
  contents: write  # publicar a versão do Agent em Releases (só em push na main)

jobs:
  windows:
    name: Gerar agente Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas
        run: python -m pip install --upgrade -r desktop-agent/requirements.txt
      - name: Sintaxe e testes
        shell: pwsh
        working-directory: desktop-agent
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Ler versão do Agent
        id: versao
        shell: pwsh
        working-directory: desktop-agent
        run: |
          $v = python -c "import agent; print(agent.__version__)"
          "versao=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Preparar ícone e logo oficiais
        shell: pwsh
        run: python desktop-agent/tools/prepare_brand.py
      - name: Gerar executavel unico
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Deliveryzim-Agent --icon "desktop-agent/agent/assets/deliveryzim.ico" --add-data "desktop-agent/agent/assets/icone.png;agent/assets" --add-data "desktop-agent/agent/assets/logo-branca.png;agent/assets" --add-data "desktop-agent/agent/assets/deliveryzim.ico;agent/assets" --collect-data customtkinter desktop-agent/main.py
      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.versao.outputs.versao }}" desktop-agent/installer/deliveryzim-agent.iss
          if (-not (Test-Path dist/Deliveryzim-Agent-Setup.exe)) { throw "Instalador não gerado." }
      - name: Publicar EXE e instalador
        uses: actions/upload-artifact@v4
        with:
          name: Deliveryzim-Agent-Windows-v${{ steps.versao.outputs.versao }}
          path: |
            dist/Deliveryzim-Agent-Setup.exe
            dist/Deliveryzim-Agent.exe
          if-no-files-found: error
      - name: Publicar versão em Releases (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          # Uma Release por versão (agent-vX.Y.Z), com link fixo para baixar o EXE. Versão já publicada: atualiza o arquivo.
          $tag = "agent-v$env:VERSAO"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/Deliveryzim-Agent-Setup.exe dist/Deliveryzim-Agent.exe --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/Deliveryzim-Agent-Setup.exe dist/Deliveryzim-Agent.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
              --title "Deliveryzim Agent $env:VERSAO (Windows)" `
              --notes "Baixe e abra o Deliveryzim-Agent-Setup.exe (instala, abre com o Windows e cria o atalho). O Deliveryzim-Agent.exe é a versão sem instalação. Gerado a partir da main ($env:GITHUB_SHA)."
          }
